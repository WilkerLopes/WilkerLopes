name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate main metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: WilkerLopes

          filename: github-metrics.svg

          template: classic

          base: header, activity

          config_timezone: America/Fortaleza
          config_display: large
          config_animations: yes

          config_order: >
            base.header,
            isocalendar,
            activity,
            languages

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_timestamps: yes

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_threshold: 2%

          output_action: commit
          committer_message: "chore: update GitHub metrics"

      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: WilkerLopes

          filename: github-languages.svg

          template: classic
          base: ""

          config_timezone: America/Fortaleza
          config_display: large
          config_animations: yes

          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%

          output_action: commit
          committer_message: "chore: update GitHub language metrics"
